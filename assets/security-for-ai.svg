<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Security for AI</title>
  <desc id="desc">A luminous ice-crystal butterfly above a glacial fjord, with translucent faceted wings, distant mountains, and a soft aurora. Security for AI.</desc>
